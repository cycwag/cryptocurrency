apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-tracker
  labels:
    app: currency-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: currency-tracker
  template:
    metadata:
      labels:
        app: currency-tracker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: bagasrinaldi/currency-app:latest
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 500Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: currency-tracker
  labels:
    app: currency-tracker
spec:
  type: ClusterIP
  selector:
    app: currency-tracker
  ports:
    - port: 80
      targetPort: 5000
