name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ========================================================
  # JOB 1: Code & Secret Security Scanning (SAST + Secrets)
  # ========================================================
  security-scan:
    name: Code & Secret Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit (Python SAST)
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Scan
        run: |
          bandit -r app/ -ll

  # ========================================================
  # JOB 2: Infrastructure as Code (IaC) & Manifest Security
  # ========================================================
  iac-scan:
    name: IaC & Manifest Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Config Scan (Kubernetes & Terraform)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: true
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  # ========================================================
  # JOB 3: Build, Container CVE Scan & Push to Docker Hub
  # ========================================================
  build-and-push:
    name: Build, Container Scan & Push
    needs: [security-scan, iac-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Test Tag)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          tags: bagasrinaldi/currency-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'bagasrinaldi/currency-app:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image with Dual Tagging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            bagasrinaldi/currency-app:latest
            bagasrinaldi/currency-app:${{ github.sha }}
          cache-from: type=gha
